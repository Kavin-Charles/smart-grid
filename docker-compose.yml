
services:
  # ── TimescaleDB (PostgreSQL with time-series extension) ────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: smartgrid-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartgrid
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (caching layer) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartgrid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Mosquitto MQTT Broker ──────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartgrid-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartgrid-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/smartgrid
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MODEL_WEIGHTS_PATH: /app/model_weights/lstm.pt
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      - ./model_weights:/app/model_weights
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MQTT Client (ingestion service) ────────────────────────
  mqtt-client:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartgrid-mqtt-client
    command: ["python", "-u", "app/services/mqtt_client.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/smartgrid
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    working_dir: /app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── Sensor Simulator ──────────────────────────────────────
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: smartgrid-simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      PUBLISH_INTERVAL: 10
      NUM_METERS: 10
    depends_on:
      mosquitto:
        condition: service_started

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartgrid-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  timescaledb_data:
  mosquitto_data:
